version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/exampulse
      JWT_SECRET: super_secure_jwt_secret_change_in_prod
      CLIENT_URL: http://localhost:5000
    depends_on:
      - mongo

volumes:
  mongo_data:
